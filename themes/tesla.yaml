# Drop this file in /config/themes/tesla.yaml
# Then reload themes.
# Profile -> Theme -> Tesla.

Tesla:
  primary-color: "#E82127"
  accent-color: "#3E6AE1"
  primary-background-color: "#000000"
  secondary-background-color: "#111111"
  card-background-color: "#171717"
  ha-card-background: "#171717"
  ha-card-border-radius: "18px"
  ha-card-box-shadow: "none"
  ha-card-border-width: "1px"
  ha-card-border-color: "#242424"
  divider-color: "#2A2A2A"
  primary-text-color: "#FFFFFF"
  secondary-text-color: "#9A9A9E"
  text-primary-color: "#FFFFFF"
  disabled-text-color: "#5A5A5E"
  app-header-background-color: "#000000"
  app-header-text-color: "#FFFFFF"
  app-header-selection-bar-color: "#E82127"
  sidebar-background-color: "#000000"
  sidebar-text-color: "#C8C8CC"
  sidebar-icon-color: "#C8C8CC"
  sidebar-selected-background-color: "#171717"
  sidebar-selected-icon-color: "#E82127"
  sidebar-selected-text-color: "#FFFFFF"
  switch-checked-color: "#3E6AE1"
  switch-checked-button-color: "#FFFFFF"
  slider-color: "#E82127"
  slider-secondary-color: "#2C2C2E"
  state-icon-color: "#FFFFFF"
  state-icon-active-color: "#3E6AE1"
  success-color: "#34C759"
  warning-color: "#F5A623"
  error-color: "#E82127"
  info-color: "#3E6AE1"
  modes:
    dark:
      primary-color: "#E82127"
      accent-color: "#3E6AE1"
      primary-background-color: "#000000"
      card-background-color: "#171717"
      primary-text-color: "#FFFFFF"
      secondary-text-color: "#9A9A9E"
    light:
      primary-color: "#E82127"
      accent-color: "#3E6AE1"
      primary-background-color: "#FFFFFF"
      card-background-color: "#FFFFFF"
      primary-text-color: "#171A20"
      secondary-text-color: "#5C5E62"
